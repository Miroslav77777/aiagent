[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papers-agent"
version = "0.1.0"
description = "Multi-Agent System for collecting, filtering, and analyzing scientific papers."
authors = [
    {name = "AI Solutions Architect"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "PyMuPDF>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "playwright>=1.44.0"
]

[tool.setuptools]
py-modules = ["main", "config", "db_manager", "fetcher_agent", "filter_agent", "analyst_agent", "exporter"]
